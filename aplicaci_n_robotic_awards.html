<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ROBOTIC AWARDS</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone para transpilar JSX en el navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      touch-action: manipulation;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const INITIAL_PARTICIPANTS = [
      { id: '1', name: 'Ethan', avatar: '⚽' },
      { id: '2', name: 'Juande', avatar: '👑' },
      { id: '3', name: 'Mañez', avatar: '⭐' },
      { id: '4', name: 'Garci', avatar: '🔥' },
      { id: '5', name: 'Paco', avatar: '🎯' },
      { id: '6', name: 'Lluis', avatar: '🚀' },
      { id: '7', name: 'Marco', avatar: '🦁' },
      { id: '8', name: 'Santos', avatar: '⚡' },
      { id: '9', name: 'Roberto', avatar: '💎' },
      { id: '10', name: 'Ibai', avatar: '🎮' },
      { id: '11', name: 'Escuder', avatar: '🛡️' },
      { id: '12', name: 'Quique', avatar: '🎩' },
      { id: '13', name: 'Ruben', avatar: '🥊' }
    ];

    const INITIAL_DATA = {
      participants: INITIAL_PARTICIPANTS,
      goldenBoy: {},
      icono: {},
      assist: {},
      botaOro: {},
      puskas: [],
      borracho: [],
      socrates: [],
      palmada: [],
      votes: {}
    };

    const AWARDS_INFO = {
      balonOro: {
        id: 'balonOro',
        title: 'Balón de Oro',
        icon: '🏆',
        color: 'from-amber-400 to-yellow-600',
        type: 'voting',
        desc: 'El máximo galardón. Se votará a finales de junio.'
      },
      goldenBoy: {
        id: 'goldenBoy',
        title: 'Golden Boy',
        icon: '🌟',
        color: 'from-yellow-300 to-amber-500',
        type: 'min_record',
        desc: 'Premio al más pedófilo.'
      },
      icono: {
        id: 'icono',
        title: 'Icono',
        icon: '👑',
        color: 'from-purple-500 to-indigo-600',
        type: 'max_record',
        desc: 'Premio a la mejor mami.'
      },
      assist: {
        id: 'assist',
        title: 'Mejor Asistente',
        icon: '👟',
        color: 'from-blue-500 to-cyan-600',
        type: 'counter',
        desc: 'Premio al mejor modric.'
      },
      botaOro: {
        id: 'botaOro',
        title: 'Bota de Oro',
        icon: '⚽',
        color: 'from-amber-500 to-red-600',
        type: 'counter',
        desc: 'A por el pichichi.'
      },
      puskas: {
        id: 'puskas',
        title: 'Puskas',
        icon: '🚀',
        color: 'from-emerald-500 to-teal-700',
        type: 'anecdote',
        desc: 'A por el bombón.'
      },
      borracho: {
        id: 'borracho',
        title: 'Mejor Borracho',
        icon: '🍺',
        color: 'from-orange-500 to-red-500',
        type: 'anecdote',
        desc: 'Premio al más alcohólico e historias de fiesta.'
      },
      socrates: {
        id: 'socrates',
        title: 'Premio Sócrates',
        icon: '🎓',
        color: 'from-sky-500 to-blue-700',
        type: 'anecdote',
        desc: 'Premio a la caridad, buenas acciones y frases célebres.'
      },
      palmada: {
        id: 'palmada',
        title: 'Mejor Palmada',
        icon: '👏',
        color: 'from-pink-500 to-rose-600',
        type: 'anecdote',
        desc: 'La mejor palmada gana.'
      }
    };

    function App() {
      const [data, setData] = useState(() => {
        try {
          const saved = localStorage.getItem('robotic_awards_data_v2');
          return saved ? JSON.parse(saved) : INITIAL_DATA;
        } catch (e) {
          return INITIAL_DATA;
        }
      });

      const [activeTab, setActiveTab] = useState('dashboard');
      const [selectedAward, setSelectedAward] = useState('balonOro');
      const [newParticipantName, setNewParticipantName] = useState('');
      const [toastMessage, setToastMessage] = useState(null);

      const [numberInput, setNumberInput] = useState('');
      const [selectedParticipantForRecord, setSelectedParticipantForRecord] = useState('');
      const [anecdoteText, setAnecdoteText] = useState('');
      const [selectedParticipantForAnecdote, setSelectedParticipantForAnecdote] = useState('');

      const persistData = (newData) => {
        setData(newData);
        try {
          localStorage.setItem('robotic_awards_data_v2', JSON.stringify(newData));
        } catch (e) {
          console.error("Error al guardar localmente:", e);
        }
      };

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      const handleIncrement = (awardKey, participantId, amount = 1) => {
        const currentAwardData = data[awardKey] || {};
        const currentVal = currentAwardData[participantId] || 0;
        const newVal = Math.max(0, currentVal + amount);

        const updatedData = {
          ...data,
          [awardKey]: {
            ...currentAwardData,
            [participantId]: newVal
          }
        };
        persistData(updatedData);
        const p = data.participants.find(item => item.id === participantId);
        showToast(`${AWARDS_INFO[awardKey].icon} ${p?.name}: ${newVal} en ${AWARDS_INFO[awardKey].title}`);
      };

      const handleSetMinRecord = (e) => {
        e.preventDefault();
        if (!selectedParticipantForRecord || numberInput === '') return;
        const val = parseFloat(numberInput);
        if (isNaN(val)) return;

        const currentRecords = data.goldenBoy || {};
        const updatedData = {
          ...data,
          goldenBoy: {
            ...currentRecords,
            [selectedParticipantForRecord]: val
          }
        };
        persistData(updatedData);
        const p = data.participants.find(item => item.id === selectedParticipantForRecord);
        showToast(`🌟 Marca de ${p?.name} actualizada: ${val}`);
        setNumberInput('');
      };

      const handleSetMaxRecord = (e) => {
        e.preventDefault();
        if (!selectedParticipantForRecord || numberInput === '') return;
        const val = parseFloat(numberInput);
        if (isNaN(val)) return;

        const currentRecords = data.icono || {};
        const updatedData = {
          ...data,
          icono: {
            ...currentRecords,
            [selectedParticipantForRecord]: val
          }
        };
        persistData(updatedData);
        const p = data.participants.find(item => item.id === selectedParticipantForRecord);
        showToast(`👑 Récord de ${p?.name} actualizado: ${val}`);
        setNumberInput('');
      };

      const handleAddAnecdote = (awardKey, e) => {
        e.preventDefault();
        if (!selectedParticipantForAnecdote || !anecdoteText.trim()) return;

        const p = data.participants.find(item => item.id === selectedParticipantForAnecdote);
        const newEntry = {
          id: Date.now().toString(),
          participantId: p.id,
          participantName: p.name,
          avatar: p.avatar,
          text: anecdoteText.trim(),
          date: new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'short' })
        };

        const currentList = data[awardKey] || [];
        const updatedData = {
          ...data,
          [awardKey]: [newEntry, ...currentList]
        };

        persistData(updatedData);
        showToast(`✨ Anécdota añadida para ${p.name}`);
        setAnecdoteText('');
      };

      const handleVote = (candidateId) => {
        const votes = data.votes || {};
        const currentVal = votes[candidateId] || 0;
        const updatedData = {
          ...data,
          votes: {
            ...votes,
            [candidateId]: currentVal + 1
          }
        };
        persistData(updatedData);
        const p = data.participants.find(item => item.id === candidateId);
        showToast(`🗳️ Voto registrado para ${p?.name}`);
      };

      const handleAddParticipant = (e) => {
        e.preventDefault();
        if (!newParticipantName.trim()) return;

        const emojis = ['🏆', '⚽', '🎯', '🔥', '⚡', '🌟', '🚀', '👑', '💎', '🥊', '🎩', '🛡️'];
        const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];

        const newParticipant = {
          id: Date.now().toString(),
          name: newParticipantName.trim(),
          avatar: randomEmoji
        };

        const updatedData = {
          ...data,
          participants: [...data.participants, newParticipant]
        };

        persistData(updatedData);
        setNewParticipantName('');
        showToast(`👤 ${newParticipant.name} añadido`);
      };

      const getLeader = (awardKey) => {
        const award = AWARDS_INFO[awardKey];
        if (!award) return null;

        if (award.type === 'counter') {
          const counts = data[awardKey] || {};
          let maxVal = -1;
          let leaderId = null;

          Object.entries(counts).forEach(([id, val]) => {
            if (val > maxVal && val > 0) {
              maxVal = val;
              leaderId = id;
            }
          });

          if (!leaderId) return null;
          const p = data.participants.find(item => item.id === leaderId);
          return { ...p, val: maxVal };
        }

        if (award.type === 'min_record') {
          const records = data.goldenBoy || {};
          let minVal = Infinity;
          let leaderId = null;

          Object.entries(records).forEach(([id, val]) => {
            if (val < minVal) {
              minVal = val;
              leaderId = id;
            }
          });

          if (!leaderId || minVal === Infinity) return null;
          const p = data.participants.find(item => item.id === leaderId);
          return { ...p, val: minVal };
        }

        if (award.type === 'max_record') {
          const records = data.icono || {};
          let maxVal = -Infinity;
          let leaderId = null;

          Object.entries(records).forEach(([id, val]) => {
            if (val > maxVal) {
              maxVal = val;
              leaderId = id;
            }
          });

          if (!leaderId || maxVal === -Infinity) return null;
          const p = data.participants.find(item => item.id === leaderId);
          return { ...p, val: maxVal };
        }

        if (award.type === 'anecdote') {
          const list = data[awardKey] || [];
          if (list.length === 0) return null;
          const first = list[0];
          return { name: first.participantName, avatar: first.avatar, val: list.length + ' reg.' };
        }

        return null;
      };

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col font-sans pb-20 select-none">
          {/* Header */}
          <header className="bg-slate-800/90 backdrop-blur-md border-b border-slate-700/60 sticky top-0 z-30 px-4 py-3 flex items-center justify-between shadow-lg">
            <div className="flex items-center space-x-2">
              <span className="text-2xl animate-bounce">🤖</span>
              <div>
                <h1 className="font-extrabold text-lg bg-gradient-to-r from-amber-400 to-yellow-200 bg-clip-text text-transparent">
                  ROBOTIC AWARDS
                </h1>
                <p className="text-xs text-slate-400">Temporada 2025/2026</p>
              </div>
            </div>
            <div className="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/30 px-2.5 py-1 rounded-full font-medium">
              {data.participants.length} Amigos
            </div>
          </header>

          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-amber-500 text-slate-950 px-4 py-2 rounded-full font-semibold text-sm shadow-xl flex items-center space-x-2 animate-fade-in">
              <span>✨</span>
              <span>{toastMessage}</span>
            </div>
          )}

          {/* Main Container */}
          <main className="flex-1 max-w-md w-full mx-auto px-4 py-4 space-y-5">
            {/* TAB 1: DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div className="space-y-5">
                <div className="bg-gradient-to-r from-amber-600 via-amber-500 to-yellow-600 p-4 rounded-2xl text-slate-950 font-bold shadow-xl relative overflow-hidden">
                  <div className="relative z-10">
                    <div className="flex justify-between items-start">
                      <div>
                        <span className="text-xs uppercase tracking-wider opacity-80">Gran Gala Final</span>
                        <h2 className="text-xl font-extrabold mt-0.5">Balón de Oro 🏆</h2>
                      </div>
                      <span className="bg-slate-950/20 px-2.5 py-1 rounded-full text-xs">Junio 2026</span>
                    </div>
                    <p className="text-xs font-medium mt-2 opacity-90">
                      Las votaciones oficiales se abrirán a finales de junio para elegir al ganador indiscutible del grupo.
                    </p>
                  </div>
                </div>

                <div className="space-y-3">
                  <h3 className="text-sm font-bold uppercase tracking-wider text-slate-400 px-1">
                    Resumen de Premios
                  </h3>
                  <div className="grid grid-cols-1 gap-3">
                    {Object.values(AWARDS_INFO).map((award) => {
                      const leader = getLeader(award.id);
                      return (
                        <div
                          key={award.id}
                          onClick={() => {
                            setSelectedAward(award.id);
                            setActiveTab('award-detail');
                          }}
                          className="bg-slate-800/80 border border-slate-700/80 rounded-xl p-3.5 flex items-center justify-between cursor-pointer hover:bg-slate-800 transition active:scale-[0.99] shadow-sm"
                        >
                          <div className="flex items-center space-x-3">
                            <div className={`w-10 h-10 rounded-xl bg-gradient-to-br ${award.color} flex items-center justify-center text-xl shadow-md`}>
                              {award.icon}
                            </div>
                            <div>
                              <h4 className="font-bold text-sm text-slate-100">{award.title}</h4>
                              <p className="text-xs text-slate-400 line-clamp-1">{award.desc}</p>
                            </div>
                          </div>
                          <div className="text-right pl-2">
                            {leader ? (
                              <div className="flex items-center space-x-1.5 bg-slate-900/60 px-2.5 py-1 rounded-lg border border-slate-700/50">
                                <span className="text-sm">{leader.avatar}</span>
                                <span className="text-xs font-bold text-amber-400">{leader.name}</span>
                                {leader.val !== undefined && (
                                  <span className="text-xs font-mono font-semibold text-slate-300">({leader.val})</span>
                                )}
                              </div>
                            ) : (
                              <span className="text-xs text-slate-500 font-medium">Sin datos</span>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 2: AWARDS LIST */}
            {activeTab === 'awards' && (
              <div className="space-y-3">
                <h2 className="text-sm font-bold uppercase tracking-wider text-slate-400 px-1">
                  Todos los Premios (9)
                </h2>
                <div className="grid grid-cols-1 gap-3">
                  {Object.values(AWARDS_INFO).map((award) => (
                    <div
                      key={award.id}
                      onClick={() => {
                        setSelectedAward(award.id);
                        setActiveTab('award-detail');
                      }}
                      className="bg-slate-800 border border-slate-700/80 rounded-2xl p-4 flex items-center space-x-4 cursor-pointer hover:border-amber-500/50 transition active:scale-[0.98]"
                    >
                      <div className={`w-12 h-12 rounded-2xl bg-gradient-to-br ${award.color} flex items-center justify-center text-2xl shadow-lg shrink-0`}>
                        {award.icon}
                      </div>
                      <div className="flex-1">
                        <h3 className="font-bold text-base text-slate-100">{award.title}</h3>
                        <p className="text-xs text-slate-400 mt-0.5 leading-relaxed">{award.desc}</p>
                      </div>
                      <span className="text-slate-500 text-lg">❯</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 3: PARTICIPANTS LIST */}
            {activeTab === 'participants' && (
              <div className="space-y-4">
                <div className="flex justify-between items-center px-1">
                  <h2 className="text-sm font-bold uppercase tracking-wider text-slate-400">
                    Grupo de Amigos ({data.participants.length})
                  </h2>
                </div>

                <form onSubmit={handleAddParticipant} className="flex gap-2">
                  <input
                    type="text"
                    placeholder="Añadir nuevo amigo..."
                    value={newParticipantName}
                    onChange={(e) => setNewParticipantName(e.target.value)}
                    className="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500"
                  />
                  <button
                    type="submit"
                    className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2.5 rounded-xl text-sm shadow-md transition"
                  >
                    + Añadir
                  </button>
                </form>

                <div className="grid grid-cols-1 gap-2.5">
                  {data.participants.map((p) => {
                    const goals = (data.botaOro && data.botaOro[p.id]) || 0;
                    const assists = (data.assist && data.assist[p.id]) || 0;
                    const goldenBoyRecord = data.goldenBoy && data.goldenBoy[p.id];
                    const iconoRecord = data.icono && data.icono[p.id];

                    return (
                      <div
                        key={p.id}
                        className="bg-slate-800/80 border border-slate-700/70 rounded-xl p-3 flex items-center justify-between"
                      >
                        <div className="flex items-center space-x-3">
                          <div className="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center text-xl shadow-inner">
                            {p.avatar}
                          </div>
                          <div>
                            <h4 className="font-bold text-sm text-slate-100">{p.name}</h4>
                            <div className="flex items-center space-x-3 text-xs text-slate-400 mt-0.5">
                              <span>⚽ {goals} goles</span>
                              <span>👟 {assists} asist.</span>
                            </div>
                          </div>
                        </div>
                        <div className="text-right text-xs space-y-0.5">
                          {goldenBoyRecord !== undefined && (
                            <div className="text-amber-400 font-mono">🌟 GB: {goldenBoyRecord}</div>
                          )}
                          {iconoRecord !== undefined && (
                            <div className="text-purple-400 font-mono">👑 Icono: {iconoRecord}</div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TAB 4: AWARD DETAIL SCREEN */}
            {activeTab === 'award-detail' && (
              <div className="space-y-4">
                <button
                  onClick={() => setActiveTab('dashboard')}
                  className="text-xs font-semibold text-slate-400 flex items-center space-x-1 hover:text-slate-200 transition"
                >
                  <span>❮</span>
                  <span>Volver a Inicio</span>
                </button>

                {(() => {
                  const award = AWARDS_INFO[selectedAward];
                  return (
                    <div className={`bg-gradient-to-br ${award.color} rounded-2xl p-4 text-slate-950 shadow-xl space-y-1`}>
                      <div className="flex items-center space-x-3">
                        <span className="text-3xl">{award.icon}</span>
                        <h2 className="text-xl font-extrabold">{award.title}</h2>
                      </div>
                      <p className="text-xs font-medium opacity-90 leading-relaxed pt-1">
                        {award.desc}
                      </p>
                    </div>
                  );
                })()}

                {/* VOTING */}
                {AWARDS_INFO[selectedAward].type === 'voting' && (
                  <div className="space-y-4 bg-slate-800/60 border border-slate-700/80 rounded-2xl p-4">
                    <div className="text-center py-2 space-y-1">
                      <span className="text-3xl">🔒</span>
                      <h3 className="font-bold text-sm text-slate-200">Votación Bloqueada</h3>
                      <p className="text-xs text-slate-400 max-w-xs mx-auto">
                        Este premio se votará colectivamente a finales de junio de 2026.
                      </p>
                    </div>

                    <div className="border-t border-slate-700/80 pt-3">
                      <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                        Simulador de Votación del Grupo
                      </h4>
                      <div className="space-y-2">
                        {data.participants.map((p) => {
                          const votesCount = (data.votes && data.votes[p.id]) || 0;
                          return (
                            <div key={p.id} className="flex items-center justify-between bg-slate-800 p-2.5 rounded-xl">
                              <div className="flex items-center space-x-2">
                                <span>{p.avatar}</span>
                                <span className="text-sm font-semibold">{p.name}</span>
                              </div>
                              <div className="flex items-center space-x-2">
                                <span className="text-xs font-mono bg-slate-900 px-2 py-0.5 rounded text-amber-400">
                                  {votesCount} votos
                                </span>
                                <button
                                  onClick={() => handleVote(p.id)}
                                  className="bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold px-2.5 py-1 rounded-lg transition"
                                >
                                  Votar
                                </button>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                )}

                {/* MIN RECORD */}
                {AWARDS_INFO[selectedAward].type === 'min_record' && (
                  <div className="space-y-4">
                    <form onSubmit={handleSetMinRecord} className="bg-slate-800 border border-slate-700 rounded-2xl p-3.5 space-y-3">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400">
                        Registrar Marca Numérica
                      </h3>
                      <div className="grid grid-cols-2 gap-2">
                        <select
                          value={selectedParticipantForRecord}
                          onChange={(e) => setSelectedParticipantForRecord(e.target.value)}
                          className="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500"
                        >
                          <option value="">Seleccionar amigo...</option>
                          {data.participants.map((p) => (
                            <option key={p.id} value={p.id}>{p.avatar} {p.name}</option>
                          ))}
                        </select>

                        <input
                          type="number"
                          step="any"
                          placeholder="Número (ej. 15)"
                          value={numberInput}
                          onChange={(e) => setNumberInput(e.target.value)}
                          className="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500"
                        />
                      </div>
                      <button
                        type="submit"
                        className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2 rounded-xl text-xs transition"
                      >
                        Guardar Marca
                      </button>
                    </form>

                    <div className="space-y-2">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 px-1">
                        Clasificación Récord Mínimo (Menor es Mejor)
                      </h3>
                      {(() => {
                        const records = data.goldenBoy || {};
                        const sorted = [...data.participants]
                          .filter(p => records[p.id] !== undefined)
                          .sort((a, b) => records[a.id] - records[b.id]);

                        if (sorted.length === 0) {
                          return (
                            <div className="bg-slate-800/40 border border-dashed border-slate-700 rounded-2xl p-6 text-center text-xs text-slate-500">
                              Aún no hay marcas registradas. ¡Sé el primero en añadir una!
                            </div>
                          );
                        }

                        return sorted.map((p, index) => (
                          <div
                            key={p.id}
                            className={`p-3 rounded-xl border flex items-center justify-between ${
                              index === 0
                                ? 'bg-amber-500/10 border-amber-500/50 text-amber-300'
                                : 'bg-slate-800 border-slate-700'
                            }`}
                          >
                            <div className="flex items-center space-x-3">
                              <span className="font-extrabold text-sm w-5 text-center">
                                {index === 0 ? '🥇' : `#${index + 1}`}
                              </span>
                              <span className="text-lg">{p.avatar}</span>
                              <span className="font-bold text-sm text-slate-100">{p.name}</span>
                            </div>
                            <span className="font-mono font-bold text-base px-2.5 py-0.5 rounded-lg bg-slate-900">
                              {records[p.id]}
                            </span>
                          </div>
                        ));
                      })()}
                    </div>
                  </div>
                )}

                {/* MAX RECORD */}
                {AWARDS_INFO[selectedAward].type === 'max_record' && (
                  <div className="space-y-4">
                    <form onSubmit={handleSetMaxRecord} className="bg-slate-800 border border-slate-700 rounded-2xl p-3.5 space-y-3">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400">
                        Registrar Marca Numérica
                      </h3>
                      <div className="grid grid-cols-2 gap-2">
                        <select
                          value={selectedParticipantForRecord}
                          onChange={(e) => setSelectedParticipantForRecord(e.target.value)}
                          className="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-purple-500"
                        >
                          <option value="">Seleccionar amigo...</option>
                          {data.participants.map((p) => (
                            <option key={p.id} value={p.id}>{p.avatar} {p.name}</option>
                          ))}
                        </select>

                        <input
                          type="number"
                          step="any"
                          placeholder="Número (ej. 99)"
                          value={numberInput}
                          onChange={(e) => setNumberInput(e.target.value)}
                          className="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-purple-500"
                        />
                      </div>
                      <button
                        type="submit"
                        className="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 rounded-xl text-xs transition"
                      >
                        Guardar Récord
                      </button>
                    </form>

                    <div className="space-y-2">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 px-1">
                        Clasificación Récord Máximo (Mayor es Mejor)
                      </h3>
                      {(() => {
                        const records = data.icono || {};
                        const sorted = [...data.participants]
                          .filter(p => records[p.id] !== undefined)
                          .sort((a, b) => records[b.id] - records[a.id]);

                        if (sorted.length === 0) {
                          return (
                            <div className="bg-slate-800/40 border border-dashed border-slate-700 rounded-2xl p-6 text-center text-xs text-slate-500">
                              Aún no hay récords registrados. ¡Sé el primero en añadir uno!
                            </div>
                          );
                        }

                        return sorted.map((p, index) => (
                          <div
                            key={p.id}
                            className={`p-3 rounded-xl border flex items-center justify-between ${
                              index === 0
                                ? 'bg-purple-500/10 border-purple-500/50 text-purple-300'
                                : 'bg-slate-800 border-slate-700'
                            }`}
                          >
                            <div className="flex items-center space-x-3">
                              <span className="font-extrabold text-sm w-5 text-center">
                                {index === 0 ? '👑' : `#${index + 1}`}
                              </span>
                              <span className="text-lg">{p.avatar}</span>
                              <span className="font-bold text-sm text-slate-100">{p.name}</span>
                            </div>
                            <span className="font-mono font-bold text-base px-2.5 py-0.5 rounded-lg bg-slate-900">
                              {records[p.id]}
                            </span>
                          </div>
                        ));
                      })()}
                    </div>
                  </div>
                )}

                {/* COUNTERS */}
                {AWARDS_INFO[selectedAward].type === 'counter' && (
                  <div className="space-y-2.5">
                    <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 px-1">
                      Puntuaciones del Grupo
                    </h3>
                    {data.participants.map((p) => {
                      const awardKey = selectedAward;
                      const count = (data[awardKey] && data[awardKey][p.id]) || 0;

                      return (
                        <div
                          key={p.id}
                          className="bg-slate-800 border border-slate-700/80 rounded-xl p-3 flex items-center justify-between"
                        >
                          <div className="flex items-center space-x-3">
                            <span className="text-xl">{p.avatar}</span>
                            <span className="font-bold text-sm text-slate-100">{p.name}</span>
                          </div>
                          <div className="flex items-center space-x-2">
                            <button
                              onClick={() => handleIncrement(awardKey, p.id, -1)}
                              className="w-8 h-8 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold text-sm flex items-center justify-center transition active:scale-95"
                            >
                              -1
                            </button>
                            <span className="font-mono font-bold text-base min-w-[2.5rem] text-center bg-slate-900 px-2.5 py-1 rounded-lg text-amber-400">
                              {count}
                            </span>
                            <button
                              onClick={() => handleIncrement(awardKey, p.id, 1)}
                              className="w-8 h-8 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-sm flex items-center justify-center shadow-sm transition active:scale-95"
                            >
                              +1
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}

                {/* ANECDOTE LOGS */}
                {AWARDS_INFO[selectedAward].type === 'anecdote' && (
                  <div className="space-y-4">
                    <form
                      onSubmit={(e) => handleAddAnecdote(selectedAward, e)}
                      className="bg-slate-800 border border-slate-700 rounded-2xl p-3.5 space-y-3"
                    >
                      <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400">
                        Añadir Registro / Anécdota
                      </h3>
                      <select
                        value={selectedParticipantForAnecdote}
                        onChange={(e) => setSelectedParticipantForAnecdote(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500"
                      >
                        <option value="">Seleccionar protagonista...</option>
                        {data.participants.map((p) => (
                          <option key={p.id} value={p.id}>{p.avatar} {p.name}</option>
                        ))}
                      </select>

                      <textarea
                        rows="2"
                        placeholder="Describe el momento o anécdota..."
                        value={anecdoteText}
                        onChange={(e) => setAnecdoteText(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500"
                      ></textarea>

                      <button
                        type="submit"
                        className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2 rounded-xl text-xs transition"
                      >
                        Publicar Anécdota
                      </button>
                    </form>

                    <div className="space-y-2.5">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 px-1">
                        Historial Registrado
                      </h3>
                      {(() => {
                        const list = data[selectedAward] || [];
                        if (list.length === 0) {
                          return (
                            <div className="bg-slate-800/40 border border-dashed border-slate-700 rounded-2xl p-6 text-center text-xs text-slate-500">
                              Aún no hay anécdotas en esta categoría. ¡Añade la primera!
                            </div>
                          );
                        }

                        return list.map((item) => (
                          <div
                            key={item.id}
                            className="bg-slate-800 border border-slate-700/80 rounded-xl p-3.5 space-y-2"
                          >
                            <div className="flex items-center justify-between">
                              <div className="flex items-center space-x-2">
                                <span className="text-lg">{item.avatar}</span>
                                <span className="font-bold text-sm text-amber-400">{item.participantName}</span>
                              </div>
                              <span className="text-[10px] text-slate-500">{item.date}</span>
                            </div>
                            <p className="text-xs text-slate-200 leading-relaxed bg-slate-900/60 p-2.5 rounded-lg border border-slate-800">
                              "{item.text}"
                            </p>
                          </div>
                        ));
                      })()}
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* Bottom Navigation */}
          <nav className="fixed bottom-0 left-0 right-0 bg-slate-800/95 backdrop-blur-md border-t border-slate-700/80 z-30 max-w-md mx-auto">
            <div className="grid grid-cols-3 h-14">
              <button
                onClick={() => setActiveTab('dashboard')}
                className={`flex flex-col items-center justify-center space-y-1 transition ${
                  activeTab === 'dashboard' ? 'text-amber-400 font-bold' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <span className="text-lg">📊</span>
                <span className="text-[10px]">Inicio</span>
              </button>

              <button
                onClick={() => setActiveTab('awards')}
                className={`flex flex-col items-center justify-center space-y-1 transition ${
                  activeTab === 'awards' || activeTab === 'award-detail'
                    ? 'text-amber-400 font-bold'
                    : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <span className="text-lg">🏅</span>
                <span className="text-[10px]">Premios</span>
              </button>

              <button
                onClick={() => setActiveTab('participants')}
                className={`flex flex-col items-center justify-center space-y-1 transition ${
                  activeTab === 'participants' ? 'text-amber-400 font-bold' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <span className="text-lg">👥</span>
                <span className="text-[10px]">Amigos</span>
              </button>
            </div>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
